# Enso catalog — the single source of truth for how the Enso model family is served.
# Hanzo AI Inc. Enso is Hanzo's PROPRIETARY frontier family (closed, unlike the open
# Zen family). The SAME binary serves this catalog when ZEN_FAMILY=enso; hanzoai/ai
# discovers it at runtime from GET /v1/models exactly as it does zen. Edit the family
# here, nowhere else. See hip-00NN for the design.
#
# EVERY rung/arm/synth is served through the DigitalOcean GenAI gateway (provider
# `do`, one DO_AI_API_KEY) — the only upstream that actually serves under our keys, and
# the same gateway zen's catalog uses. Direct anthropic/openai providers are NOT used
# (their standalone keys are dead), so this family carries a single `do` provider. The
# `do` model slugs below are the real, verified-live gateway ids; identity injection
# still hides them — a caller only ever sees "Enso".
#
# Design (one way to do everything — identical to catalog.yaml):
#   providers  — upstream endpoint + credential env, keyed by short name.
#   models     — an enso SKU. `route` is an ascending-context ladder of rungs; the
#                engine picks the SMALLEST rung whose context holds the prompt and
#                advertises the LARGEST as the SKU's context_window (the 1M overflow).
#   arms/synth — a FAN-OUT SKU (enso-ultra): the request is served to EVERY arm
#                concurrently, then one synthesizer folds the candidate answers into a
#                single best final answer. `route[0]` is the SKU's public billing rate
#                (retail + advertised context); arms/synth are where the fan-out goes.
#   cost       — the upstream's $/MTok (input/output) on each rung — our cost basis —
#                as an EXACT decimal string. Retail (what a caller pays) is DERIVED =
#                cost × margin, or a fixed `retail:` override (used here to price the
#                family at its headline). A request bills at the rung that SERVED it.
#   identity   — prompts/<id>.md, prepended as the system turn so the model speaks as
#                Enso. Enso never reveals its upstreams (a closed family).

providers:
  do: { base: "https://inference.do-ai.run/v1", key_env: DO_AI_API_KEY, kind: openai }
  # google via the OpenAI-compatible endpoint. Enabled only once a GEMINI_API_KEY is
  # provisioned in KMS (project hanzo-enso / hanzo-zen). Until verified, this stanza is
  # commented so the family ships without a dangling provider; the gemini-3.1-pro arm
  # is likewise held out.
  # TODO(enso): provision GEMINI_API_KEY in KMS hanzo-enso, then uncomment.
  # google:  { base: "https://generativelanguage.googleapis.com/v1beta/openai", key_env: GEMINI_API_KEY, kind: openai }

# margin is the resale multiple (retail = cost × margin) applied where a SKU does not
# set a fixed retail override. Enso prices at fixed headline numbers (below), so margin
# is the floor for any derived rung — every tier still bills strictly above cost.
margin: "3.0"

models:
  # ── enso (flagship) ──────────────────────────────────────────────────────────
  # Opus-quality by default (200K rung); a prompt past 200K overflows to the 1M
  # long-context rung. Headline retail 20.00 → 60.00 $/MTok (the base rung). The
  # overflow rung bills at ITS retail (never underbill on overflow).
  enso:
    gated: false     # OPEN discovery — no waitlist access grant required
    min_tier: trial  # subscription floor: callable on trial or paid (this is the access control now)
    route:
      - { provider: do, upstream: anthropic-claude-opus-4.8, ctx: 200000,  cost: { in: "6.00", out: "18.00" }, retail: { in: "20.00", out: "60.00" } }
      - { provider: do, upstream: deepseek-v4-pro,           ctx: 1000000, cost: { in: "1.25", out: "5.00"  }, retail: { in: "12.00", out: "36.00" } }  # 1M overflow

  # ── enso-flash (fast / economical tier) ──────────────────────────────────────
  # The cheap, low-latency member: a single-arm ladder (fast base rung, 1M overflow)
  # for high-volume and everyday work. Headline retail 2.00 → 6.00 $/MTok, margin-
  # positive over cost on both rungs (base 0.112/0.224 → 18×/27×; overflow 1.25/5.00 →
  # 1.6×/1.2×). Same closed-family voice (prompts/enso-flash.md) and gating as the rest.
  enso-flash:
    gated: false  # OPEN — generally available: listed for discovery AND callable by anyone (no access grant)
    route:
      - { provider: do, upstream: deepseek-4-flash, ctx: 262144,  cost: { in: "0.112", out: "0.224" }, retail: { in: "2.00", out: "6.00" } }
      - { provider: do, upstream: deepseek-v4-pro,  ctx: 1000000, cost: { in: "1.25",  out: "5.00"  }, retail: { in: "2.00", out: "6.00" } }  # 1M overflow

  # ── enso-ultra (adaptive fan-out → verify-then-select over the best accessible arms) ──
  # route[0] is the SKU's public billing rate + advertised context (retail ~2× enso).
  # It is the METER, not the path. serving is ADAPTIVE (escalate: below): the request is
  # PROBED on one task-appropriate arm first (rank[task][0]); only when that probe is
  # low-confidence does it ESCALATE — fan out the top-`panel` task-ranked arms and SELECT
  # the correct answer (select.go: self-consistency fast path when the arms agree, else a
  # `synth` judge). A confident probe bills ONE arm — the fixed 6-arm floor is gone.
  # Billing sums exactly the arms that ran (probe-only: 1; escalated: the panel) plus the
  # judge ONLY when it ran, at route[0]'s retail; cost is the real sum of each upstream.
  # All arms are DO slugs; identity injection still hides them — the caller only ever
  # sees "Enso Ultra".
  enso-ultra:
    gated: false     # OPEN discovery — no waitlist access grant required
    min_tier: paid   # subscription floor: the top SKU is paid-only (this is the access control now)
    route:
      - { provider: do, upstream: anthropic-claude-opus-4.8, ctx: 200000, cost: { in: "6.00", out: "18.00" }, retail: { in: "40.00", out: "120.00" } }
    arms:
      - { provider: do, upstream: anthropic-claude-opus-4.8, ctx: 200000,  cost: { in: "6.00", out: "18.00" } }  # top proprietary
      - { provider: do, upstream: anthropic-claude-fable-5,  ctx: 200000,  cost: { in: "5.00", out: "15.00" } }  # proprietary
      - { provider: do, upstream: openai-gpt-5.6-sol,        ctx: 200000,  cost: { in: "5.00", out: "15.00" } }  # proprietary
      - { provider: do, upstream: deepseek-v4-pro,           ctx: 1000000, cost: { in: "1.25", out: "5.00"  } }  # 1M-ctx OSS
      - { provider: do, upstream: qwen3.5-397b-a17b,         ctx: 262144,  cost: { in: "0.60", out: "2.00"  } }  # top OSS MoE
      - { provider: do, upstream: nemotron-3-ultra-550b,     ctx: 131072,  cost: { in: "0.60", out: "2.00"  } }  # top OSS
    synth:
      { provider: do, upstream: anthropic-claude-opus-4.8, ctx: 200000, cost: { in: "6.00", out: "18.00" } }
    # Adaptive escalation. `panel` = arms in the escalated fan-out (probe included), so a
    # non-probe-only request spends 3 arms, not 6. `rank` is the task→arm order, best
    # first, and the ONE source of both probe (rank[task][0]) and panel (rank[task][:3]):
    # `default` favours the strongest all-round reasoners; `code` promotes the coder-
    # strong arms. Every name is one of the arms above (validated at load).
    escalate:
      mode: adaptive
      panel: 3
      rank:
        default: [anthropic-claude-opus-4.8, deepseek-v4-pro, anthropic-claude-fable-5, openai-gpt-5.6-sol, qwen3.5-397b-a17b, nemotron-3-ultra-550b]
        code:    [openai-gpt-5.6-sol, anthropic-claude-opus-4.8, deepseek-v4-pro, qwen3.5-397b-a17b, anthropic-claude-fable-5, nemotron-3-ultra-550b]

# Enso is a three-SKU family: the flagship `enso`, the cheap `enso-flash`, and the
# adaptive fan-out `enso-ultra`. No aliases, no per-tier SKUs — one SKU per capability,
# forwards-only.
